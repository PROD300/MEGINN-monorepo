<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд юзер-тестов</title>
<link rel="stylesheet" href="ds.css">
<style>
  :root{
    --paper:#f2f4ee; --card:#fff; --ink:#17191d; --muted:#5f656d; --faint:#9aa0a8;
    --line:rgba(20,24,28,.10); --line-soft:rgba(20,24,28,.06);
    --lime:#d3f23e; --dark:#15171b; --soft:#edf0e8; --soft2:#e4e8dd; --sidebar:#fbfcf9;
    --good:#1f8f53; --goodbg:#e7f4ec; --warn:#c43d2e; --warnbg:#fbe9e6;
    --amber:#a76d05; --amberbg:#f8efd8; --info:#2e6bb0; --infobg:#e9f1fa;
    --r:14px; --r-lg:18px; --r-sm:10px;
    --sh:0 1px 2px rgba(16,24,16,.05), 0 6px 22px rgba(16,24,16,.05);
    --sh-sm:0 1px 2px rgba(16,24,16,.05);
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  .num{font-variant-numeric:tabular-nums} .muted{color:var(--muted)} .faint{color:var(--faint)}
  button{font:inherit;cursor:pointer}

  /* ── app shell ── */
  .app{display:flex;min-height:100vh}
  .sidebar{flex:0 0 240px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
  .brand{padding:6px 10px 18px;display:flex;flex-direction:column;gap:3px}
  .brand .bt{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .brand .bs{font-size:11.5px;color:var(--faint)}
  .navgroup{margin-top:14px}
  .navgroup .gl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:0 10px 7px}
  .nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:9px 10px;border-radius:var(--r-sm);transition:background .12s,color .12s}
  .nav-i:hover{background:var(--soft);color:var(--ink)}
  .nav-i.on{background:var(--ink);color:#fff}
  .nav-i .ic{width:17px;height:17px;flex:0 0 auto;opacity:.9}
  .nav-i .ct{margin-left:auto;font-size:11px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
  .nav-i.on .ct{color:rgba(255,255,255,.55)}
  .nav-i.warn .ct{color:var(--warn)}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:2px 10px}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--goodbg);flex:0 0 auto}
  .live.stale .dot{background:var(--amber);box-shadow:0 0 0 3px var(--amberbg)}
  .live.off{color:var(--warn)} .live.off .dot{background:var(--warn);box-shadow:0 0 0 3px var(--warnbg)}
  .freshline{font-size:11px;color:var(--faint);padding:0 10px;line-height:1.4}
  .roundsel-w{display:flex;flex-direction:column;gap:4px;padding:0 10px}
  .roundsel-w[hidden]{display:none}
  .roundsel-w>span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  select.sel.rs{width:100%;font-size:12.5px;padding:7px 30px 7px 11px}
  .side-foot .rnd{font-size:11.5px;color:var(--faint);padding:0 10px}
  .btn{font-size:13px;font-weight:600;padding:9px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);transition:border-color .12s}
  .btn:hover{border-color:rgba(20,24,28,.28)} .btn.primary{background:var(--lime);border-color:transparent;color:#1a1d12} .btn.ghost{background:transparent}
  .btn.block{width:100%}

  .main{flex:1 1 auto;min-width:0;overflow:auto;height:100vh}
  .view{max-width:1080px;margin:0 auto;padding:34px 38px 90px}
  @keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .view{animation:viewIn .22s ease}
  .vhead{margin-bottom:22px}
  .vhead h1{font-size:var(--fs-xl);font-weight:var(--fw-b);letter-spacing:-.025em;margin:0}
  .vhead .vsub{font-size:13.5px;color:var(--muted);margin:5px 0 0;max-width:680px}
  .vhead .vact{margin-top:0}
  .vrow{display:flex;align-items:flex-start;gap:16px}
  .vrow .vact{margin-left:auto;display:flex;gap:8px;flex-shrink:0}

  .sec{margin:30px 0 14px}
  .sec-t{font-size:var(--fs-lg);font-weight:var(--fw-sb);letter-spacing:-.01em;margin:0}
  .sec-s{font-size:var(--fs-sm);color:var(--muted);margin:3px 0 0}
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px}
  .grid{display:grid;gap:16px}
  .cols-4{grid-template-columns:repeat(4,1fr)} .cols-3{grid-template-columns:repeat(3,1fr)} .cols-2{grid-template-columns:1fr 1fr}
  .empty{color:var(--muted);font-size:14px;padding:8px 2px}
  .err{background:var(--warnbg);border:1px solid #f3c4b8;color:#a33;padding:14px 16px;border-radius:var(--r);font-size:14px}
  .footnote{color:var(--muted);font-size:12.5px;margin-top:26px;line-height:1.55}

  /* flow picker */
  .fpick{display:inline-flex;background:var(--soft);border-radius:var(--r-sm);padding:3px;gap:2px;flex-wrap:wrap}
  .fpick button{border:0;background:transparent;padding:8px 14px;font-size:13px;font-weight:600;border-radius:8px;color:var(--muted)}
  .fpick button.on{background:var(--card);box-shadow:var(--sh-sm);color:var(--ink)}
  .fpick button .pn{margin-left:7px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}

  /* overview summary cards */
  .ov-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .ov-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .12s,transform .12s}
  .ov-card:hover{border-color:rgba(20,24,28,.22);transform:translateY(-1px)}
  .ov-card .ck{font-size:12px;font-weight:600;color:var(--muted)}
  .ov-card .cn{font-size:30px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .ov-card .cd{font-size:12px;color:var(--faint)}
  .ov-card .mini{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
  .ov-card .mini i{display:block;height:100%;border-radius:4px}
  .ovh{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:18px}
  .ovh b{color:var(--ink);font-weight:600}

  /* hero (before/after) */
  .hero{background:var(--dark);border-radius:var(--r-lg);padding:22px 24px;color:#fff;box-shadow:var(--sh)}
  .hero-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .hero-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--lime)}
  .hero-base{margin-left:auto;font-size:12px;color:rgba(255,255,255,.45)}
  .hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .hm .hl{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:9px}
  .hm .hv{font-size:var(--fs-2xl);font-weight:var(--fw-b);letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
  .hm .delta{font-size:12px;font-weight:700}
  .hm .delta.good{color:#86e09a} .hm .delta.bad{color:#f29486} .hm .delta.flat{color:rgba(255,255,255,.4)}
  .hm .was{font-size:12px;color:rgba(255,255,255,.42);margin-top:8px}
  .hintcard{background:var(--infobg);border:1px solid #cfe0f2;color:#23527a;border-radius:var(--r);padding:15px 18px;font-size:13.5px;line-height:1.5}

  /* KPI */
  .kpi{display:flex;flex-direction:column}
  .kpi .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:12px}
  .kpi .n{font-size:var(--fs-3xl);font-weight:var(--fw-b);letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
  .kpi .n .of{font-size:16px;color:var(--muted);font-weight:600}
  .kpi .supp{font-size:12px;color:var(--muted);margin-top:11px;font-variant-numeric:tabular-nums}
  .conftag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px}
  .conftag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
  .conf-low{background:var(--warnbg);color:var(--warn)} .conf-med{background:var(--amberbg);color:var(--amber)} .conf-high{background:var(--goodbg);color:var(--good)}
  .ci-bar{height:5px;background:var(--soft);border-radius:3px;position:relative;margin-top:10px;overflow:hidden}
  .ci-bar .rng{position:absolute;height:100%;background:rgba(20,24,28,.22);border-radius:3px}
  .alert{display:flex;gap:11px;align-items:flex-start;background:var(--amberbg);border:1px solid #f0dcae;color:#7a4e07;border-radius:var(--r);padding:14px 17px;font-size:13.5px;line-height:1.45;margin-top:16px}
  .alert .ai{font-size:15px}

  /* funnel */
  .fn-scn{font-size:12.5px;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .fn-scn .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .fn-scn code{background:var(--soft);padding:3px 9px;border-radius:7px;color:var(--ink);font-size:12px;font-family:var(--mono)}
  .fstep{margin:16px 0}.fstep:first-of-type{margin-top:0}
  .fh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
  .fh .nm{font-weight:600;font-size:14px} .fh .nm .i{color:var(--faint);font-weight:600;margin-right:7px}
  .fh .rt{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ftrack{height:30px;background:var(--soft);border-radius:8px;overflow:hidden}
  .ffill{height:100%;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 13px;font-size:12.5px;font-weight:700;border-radius:8px;min-width:44px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ffill.big{background:var(--warn)}
  .fmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .fmeta .drop{color:var(--warn);font-weight:700;font-size:12px;background:var(--warnbg);padding:2px 9px;border-radius:999px}
  .fmeta .ctx{font-size:12px;color:var(--muted)} .fmeta .dev{font-size:12px;color:var(--faint)}

  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:0 12px 12px}
  .tbl th.r,.tbl td.r{text-align:right}
  .tbl td{padding:13px 12px;border-top:1px solid var(--line-soft);vertical-align:middle;font-variant-numeric:tabular-nums}
  .tbl tr:hover td{background:var(--soft)}
  .tbl .scr{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:3px 9px;border-radius:7px;color:var(--ink)}
  .scrn{display:inline-flex;flex-direction:column;line-height:1.25;vertical-align:middle}
  .scrn.inline{flex-direction:row;align-items:baseline;gap:7px}
  .scrl{font-weight:600} .scrs{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
  .legend .sw{display:inline-flex;align-items:center;gap:6px} .legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .filterbar{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px}
  .filtgroup{display:flex;flex-direction:column;gap:6px}
  .filtgroup .gl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  select.sel{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink)}
  .roundbar{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--faint);padding:0 10px}
  .roundbar a,.rnd a{color:var(--info);cursor:pointer;text-decoration:underline}
  .scenlist .ov-card{width:100%}
  .ev-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:var(--r-sm);cursor:pointer}
  .ev-row:hover{background:var(--soft)} .ev-row+.ev-row{border-top:1px solid var(--line-soft)}
  .ev-mark{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}
  .ev-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .ev-when{font-size:var(--fs-sm);font-weight:var(--fw-sb)}
  .ev-dev{font-size:var(--fs-2xs);color:var(--faint);font-family:var(--mono)}
  .ev-row .ed{flex:0 0 auto;text-align:right;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .fscore{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
  .fscore .bar{height:7px;width:84px;background:var(--soft);border-radius:4px;overflow:hidden}
  .fscore .bar i{display:block;height:100%;border-radius:4px}
  .fscore b{min-width:24px;text-align:right}

  /* bars */
  .row{display:flex;align-items:center;gap:14px;margin:11px 0;font-size:13.5px}.row:first-child{margin-top:0}
  .row .lbl{flex:0 0 240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .lbl .ok{color:var(--good);font-weight:700;margin-right:4px}
  .row .track{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
  .row .fill{height:100%;background:var(--soft2);border-radius:5px}.row .fill.correct{background:var(--good)}
  .row .val{flex:0 0 40px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .fc-headline{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
  .fc-headline .n{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .fc-headline .lab{font-size:13px;color:var(--muted)}

  /* sessions list (rows open drawer) */
  .srow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:12px 10px;border-radius:var(--r-sm);cursor:pointer;transition:background .12s}
  .srow:hover{background:var(--soft)}
  .srow+.srow{border-top:1px solid var(--line-soft)}
  .srow .fr{flex:0 0 42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
  .srow .when{font-weight:600;font-size:13.5px;min-width:112px}
  .srow .facts{color:var(--muted);font-size:12.5px;flex:1;min-width:120px}
  .srow .dev{color:var(--faint);font-size:12px;white-space:nowrap}
  .srow .chev{color:var(--faint);font-size:14px}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;margin-left:6px;white-space:nowrap}
  .badge.warn{background:var(--warnbg);color:var(--warn)} .badge.ok{background:var(--soft);color:var(--muted)}

  /* timeline (in drawer) */
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:grid;grid-template-columns:24px 1fr auto;gap:13px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line-soft)}
  .tl li:last-child{border-bottom:0}
  .tl .idx{width:23px;height:23px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .tl .scr{font-weight:600;font-size:13.5px;font-family:var(--mono)}
  .tl .at{color:var(--faint);font-size:11.5px;display:block;margin-top:3px}
  .tl .sigs{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .sig{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .tl .dur{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}.tl .dur .clk{color:var(--faint);margin-left:9px}

  /* findings list + cards */
  .frow{width:100%;text-align:left;border:0;background:var(--card);border:1px solid var(--line-soft);box-shadow:var(--sh-sm);border-radius:var(--r);padding:15px 18px;margin-bottom:11px;cursor:pointer;transition:border-color .12s}
  .frow:hover{border-color:rgba(20,24,28,.22)}
  .frow .ft{display:flex;align-items:center;gap:9px}
  .frow .title{font-weight:700;font-size:14.5px;letter-spacing:-.01em;flex:1}
  .frow .pri{font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .frow .ev{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .sev{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
  .sev-catastrophe{background:var(--warnbg);color:var(--warn)} .sev-major{background:var(--amberbg);color:var(--amber)} .sev-minor,.sev-cosmetic{background:var(--soft);color:var(--muted)}
  .reco{background:var(--soft);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;line-height:1.5}
  .reco .r{display:flex;gap:8px}.reco .r+.r{margin-top:7px}.reco .rk{flex:0 0 120px;color:var(--muted);font-weight:600}.reco .rv{color:var(--ink)}
  .loc{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.loc .lk{font-size:11px;color:var(--faint)}
  .loc code{background:var(--soft);padding:3px 8px;border-radius:6px;color:var(--ink);font-family:var(--mono);font-size:11.5px}

  /* hypothesis verdict cards */
  .hcard{border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 18px;margin-bottom:11px;box-shadow:var(--sh-sm);background:var(--card)}
  .hc-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .hc-title{font-weight:600;font-size:14.5px;letter-spacing:-.01em;flex:1;min-width:200px}
  .hc-flow{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
  .verdict{font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .verdict::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .vd-yes{background:var(--goodbg);color:var(--good)} .vd-no{background:var(--warnbg);color:var(--warn)} .vd-nodata{background:var(--soft);color:var(--muted)} .vd-incon{background:var(--amberbg);color:var(--amber)}
  .hcbar2{margin-top:14px}
  .hcb-fr{position:relative;height:18px}
  .hcb-fact{position:absolute;bottom:0;transform:translateX(-50%);font-size:var(--fs-2xs);font-weight:var(--fw-b);white-space:nowrap;font-variant-numeric:tabular-nums}
  .hcb-rail{position:relative;height:12px;background:var(--soft);border-radius:6px}
  .hcb-zone{position:absolute;top:0;height:100%;background:var(--goodbg)}
  .hcb-zone.r{border-radius:0 6px 6px 0} .hcb-zone.l{border-radius:6px 0 0 6px}
  .hcb-ci{position:absolute;top:3px;height:6px;border-radius:3px;opacity:.5}
  .hcb-dot{position:absolute;top:0;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 2.5px var(--card)}
  .hcb-th{position:absolute;top:-4px;height:20px;width:2px;background:var(--ink)}
  .hcb-gr{position:relative;height:15px;margin-top:7px}
  .hcb-goal{position:absolute;top:0;transform:translateX(-50%);font-size:var(--fs-2xs);font-weight:var(--fw-b);color:var(--ink);white-space:nowrap}

<script>

 hyp:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h4M6.5 2v4L3 12.5A1 1 0 0 0 3.9 14h8.2a1 1 0 0 0 .9-1.5L9.5 6V2"/></svg>',

let CFG={},ENDPOINT="",KEY="",FLOWS=[],CURFLOW=0,SCREENS={},PROTO="";

function prettify(s){if(!s)return s;const seg=String(s).replace(/^\//,"").split("/").pop().replace(/[-_]/g," ");return seg?seg.charAt(0).toUpperCase()+seg.slice(1):String(s);}

function initCfg(){CFG=window.DASHBOARD_CONFIG||{};ENDPOINT=(CFG.endpoint||"").replace(/\/+$/,"");KEY=CFG.key||"";SCREENS=CFG.screens||{};PROTO=(CFG.prototypeUrl||"").trim();
  if(/ngrok/i.test(ENDPOINT)&&!window.__nf){window.__nf=1;const _f=window.fetch.bind(window);window.fetch=(u,o)=>{o=o||{};o.headers=Object.assign({"ngrok-skip-browser-warning":"1"},o.headers||{});return _f(u,o);};}

function statsURLFor(f){const p=new URLSearchParams();if(f.funnel.length)p.set("funnel",f.funnel.join(","));if(f.goal)p.set("goal",f.goal);if(f.fc&&f.fc.target)p.set("fc",(f.fc.screen||f.funnel[0]||"")+"::"+f.fc.target);if(f.name)p.set("flow",f.name);if(f.id)p.set("task",f.id);p.set("round",VIEWROUND||"current");if(KEY)p.set("key",KEY);return ENDPOINT+"/stats?"+p.toString();}

const SEV_LABEL={catastrophe:"катастрофа",major:"серьёзная",minor:"незначительная",cosmetic:"косметическая"};

let HYPS=[],BASE=null,SEG_DEV="all",SEG_PROB="all",SEG_HYP="all",FLOWDATA=[],VIEW="overview",VIEWROUND="current",DATAMETA=null;

async function load(){
  const v=$("#view");const rb=$("#refresh");

  v.innerHTML="<p class='empty'>Загружаю…</p>";
  try{
    FLOWDATA=await Promise.all(FLOWS.map(async f=>({flow:f,stats:await(await fetch(statsURLFor(f))).json()})));
    try{HYPS=await(await fetch(ENDPOINT+"/hypotheses"+keyQ())).json();}catch{HYPS=[];}
    try{BASE=await(await fetch(ENDPOINT+"/baseline"+keyQ())).json();}catch{BASE=null;}
    DATAMETA=(FLOWDATA[0]&&FLOWDATA[0].stats&&FLOWDATA[0].stats.dataMeta)||null;
    if(CURFLOW>=FLOWDATA.length)CURFLOW=0;
    renderNav();renderRoundLine();renderRoundSel();renderStatus(true);renderView();
  }catch(e){v.innerHTML="";v.append(el("div",{class:"err"},"Не удалось получить данные с "+ENDPOINT+"/stats. Проверь, что сбор запущен."));renderStatus(false);}

}
function curStats(){return FLOWDATA[CURFLOW]?FLOWDATA[CURFLOW].stats:null;}

// ── навигация ──
const NAV=[["overview","Обзор","overview"],["hypotheses","Гипотезы","hyp"],["flows","Сценарии","flow"],["sessions","Сессии","sess"],["findings","Находки","find"]];
function hypCounts(){let no=0,yes=0,incon=0,nd=0;(HYPS||[]).forEach(h=>{const e=evalHypothesis(h,flowStatsByName(h.flow));if(e.verdict==="no")no++;else if(e.verdict==="yes")yes++;else if(e.verdict==="incon")incon++;else nd++;});return{no,yes,incon,nd};}

  const hc=hypCounts();
  const grp=el("div",{class:"navgroup"});
  NAV.forEach(([id,label,icon])=>{
    const b=el("button",{class:"nav-i"+(VIEW===id?" on":"")+(id==="hypotheses"&&hc.no?" warn":"")},el("span",{class:"ic",html:ICON[icon]}),label);
    if(id==="hypotheses"&&(HYPS||[]).length)b.append(el("span",{class:"ct"},(hc.no?hc.no+" ✗":"✓")));

  box.append(el("span",{},(r.count?"раунд "+r.count:"раунд не начат")+(s.totals?" · "+respN+" респ.":"")));
  if(r.count){const a=el("a",{},"отменить");a.onclick=undoRound;box.append(el("span",{}," · "),a);}}

  if(!ok){li.classList.add("off");if(lt)lt.textContent="нет связи с сервером";if(fl)fl.textContent="проверь, что сбор запущен";return;}

/* ════════ ОБЗОР ════════ */
function viewOverview(v){

function buildBriefMd(S){const F=(S&&S.findings)||[],t=(S&&S.totals)||{},sm=S&&S.successMetric;const L=["# Находки юзабилити-теста — задача агенту",""];

const MEASURE_LABEL={completion:"завершение сценария",firstclick:"верный первый клик",dropoff:"отвал на шаге",lostness:"средняя потерянность"};
function opSym(op){return op==="<="?"≤":op===">="?"≥":op;}
function fmtMeasure(v,kind){return kind==="num"?(+v).toFixed(2):pct(v);}

  else if(m==="firstclick"&&st.firstClick&&st.firstClick.hits!=null){actual=st.firstClick.total?st.firstClick.hits/st.firstClick.total:0;ci=st.firstClick.ci;n=st.firstClick.total;hits=st.firstClick.hits;}
  else if(m==="dropoff"){const fn=st.funnel||[];const i=fn.findIndex(x=>x.step===h.step);if(i>0){const prev=fn[i-1].reached,reached=fn[i].reached,drop=Math.max(0,prev-reached);actual=prev?drop/prev:0;n=prev;hits=drop;ci=awCI(drop,prev);prevStep=fn[i-1].step;}}

  if(actual==null)return{verdict:"nodata",m,t,kind,stepName,prevStep};

  if(ci){if(t.op===">="){confStrong=ci.lo>=t.value;refStrong=ci.hi<t.value;}else{confStrong=ci.hi<=t.value;refStrong=ci.lo>t.value;}}

function testerPass(t,e){

  return t.success===true;}

  const at=new Date().toISOString(),map={};
  FLOWDATA.forEach(fd=>{const S=fd.stats;if(!S||!S.totals||!S.totals.testers)return;const k=kpisFor(S),fn=funnelOf(S);const big=(fn||[]).reduce((m,f,i)=>i&&f.dropFromPrev>m?f.dropFromPrev:m,0);
    map[fd.flow.name]={at,success:{hits:k.succ,total:k.goalN},drop:{pct:big},lostAvg:k.lostAvg,problems:k.problems};});
  try{await fetch(ENDPOINT+"/baseline"+keyQ(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(map)});
    await fetch(ENDPOINT+"/rounds"+keyQ(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({snapshot:map})});
    VIEWROUND="current";await load();}catch(e){}}
async function undoRound(){if(!window.confirm("Отменить последнюю фиксацию раунда? Сессии этого раунда снова сольются с предыдущими, отсчёт вернётся как было."))return;
  try{const r=await(await fetch(ENDPOINT+"/rounds"+keyQ(),{method:"DELETE"})).json();const snap=(r&&r.prevSnapshot)||null;
    await fetch(ENDPOINT+"/baseline"+keyQ(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(snap)});BASE=snap;VIEWROUND="current";await load();}catch(e){}}

$("#refresh").addEventListener("click",load);
$("#setBaseline").addEventListener("click",setBaseline);
$("#navToggle").addEventListener("click",openNav);
$("#navscrim").addEventListener("click",closeNav);
$("#tbRefresh").addEventListener("click",load);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeNav();});

</script>
